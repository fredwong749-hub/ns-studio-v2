  check_link_p3_p4: {kind: python, ref: "ns_schema.screenplay:check_link_p3_p4", link: P3-P4}
  p4_gate: {kind: python, ref: "p4_adapter:check_p4", path: tools/pipeline/p4_adapter.py, node: P4, note: 导入关口 validate_qwen_script + Shot Spec block}
  validate_qwen_script: {kind: cli, path: tools/validate_qwen_script.py, node: P4, rule_prefixes: [QW-, H3-, S1-, R-C, IMG-, RL-]}
  validate_script_strict: {kind: cli, path: tools/validate_script_strict.py, node: P4, note: 附加提示}
  shot_spec_missing: {kind: python, ref: "ns_schema.shot_spec:missing_fields", node: P4, rule_prefixes: [SS-]}
  shot_spec_sequence: {kind: python, ref: "ns_schema.shot_spec:check_sequence", node: P4, rule_prefixes: [SS-X]}
  h3_lint: {kind: python, ref: "ns_schema.h3_lint:lint_h3", node: P4, rule_prefixes: [H3-]}
  llm_output_check: {kind: python, ref: "ns_schema.llm_output_check:check_writer_output", rule_prefixes: [D1, D2, N1, P1, A1]}
  timeline_lint: {kind: python, ref: "ns_recipes.lint:lint_timeline", rule_prefixes: [RL-T]}
  recipe_lint: {kind: python, ref: "ns_recipes.lint:lint_prompt", rule_prefixes: [RL-]}
  frame_spec_compile: {kind: file, path: services/agent/ns_agent/frame_spec.py}
  s1_gate: {kind: cli, path: tools/s1_gate.py}
  image_check: {kind: file, path: services/render_router/ns_render/image_check.py}
  motion_qc: {kind: file, path: services/render_router/ns_render/motion_qc.py}
  director_review: {kind: file, path: tools/ep02_director/review.py}
  iterate_loop: {kind: file, path: tools/iterate_loop/loop.py}
  attribute_bug: {kind: cli, path: tools/pipeline/attribute_bug.py}
  bgm_brief_check: {kind: cli, path: tools/bgm/brief_schema.py, link: P4-P9, rule_prefixes: [BGM-B], note: nsfs.bgm_brief/1 格式（BGM10）}
  bgm_candidate_gate: {kind: file, path: tools/bgm/agent.py, link: P4-P9, note: "agent.gate()：人声 / 削波 / 静音 / 时长 / CLAP / 能量反向（阈值 config/bgm.json）"}

# 下游（ARCH）挂载点：knowledge 规则按 link 字段归到上面的连接；这些文件归 ARCH，CHAINSPEC 只引用
