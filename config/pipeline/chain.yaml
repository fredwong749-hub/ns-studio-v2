# 生产流水线链条契约（CHAINSPEC 2026-10-31）—— 系统骨架，单一事实来源
#
# 项目方原话（总目标）："把这条完整的生产 pipeline 从第一个 point 到 last point 梳理清楚：明确每一 point 之间要做什么、
# 不做什么，以及 format 是什么、规则是什么……每个 chain 跟 next chain 之间都有 connect，所以每个 chain 之间都有自己的
# 一些规则和 format。"
#
# 结构：
#   nodes   P0–P12：每个节点的产物（输出 schema + 例子）、谁做、UI 位置、状态（已定 / 部分 / 缺）
#   links   "Pa-Pb"：每段连接 = 输入 → 输出 的转换；必须做 / 禁止做 / 规则 / 校验器 / 失败处理 / 写作提示词
#   rules   上游（P0–P4）链条规则：id、所属 link、级别、给写作 LLM 的一句话、校验函数、证据、置信度
#           下游规则在 knowledge/rules/*.yaml（ARCH 负责，每条带 link 字段），这里按 link 引用，不复制
#   validators 校验器注册表（python 函数 / CLI），tools/pipeline/check_chain.py 逐个检查存在
#   gates   项目方闸门；fallback 回退策略
#
# 硬规则：Claude 只写系统，不写也不评价剧情内容；所有规则只讲格式与可实现性。
# 校验：.venv/Scripts/python.exe tools/pipeline/check_chain.py           （引用完整性）
#       .venv/Scripts/python.exe tools/pipeline/check_chain.py --artifact <文件>   （产物归属哪个节点、违反哪条规则）
schema: nsfs.chain/1
version: chain-v1
date: 2026-10-31
doc: docs/PIPELINE_CHAIN.md

actors:
  owner: 项目方（闸门：确认 / 花钱 / 推翻旧决定 / 删除）
  writer_llm: 写作 LLM（config/llm_providers.json 用途 script_write，现为 abliteration large-flash；只按格式填字段）
  system: 系统确定性代码（解析、编译、校验、调度；不生成内容）
  render: 渲染模型（Qwen-Image 2.1 / Qwen-Image-Edit / MiniMax H3 / TTS / 音乐模型）
  director_llm: 审片 / 导演模型（knowledge 生成的 config/recipes/director_system_prompt.md）

settings:
  writer_max_repair_rounds: 2          # knowledge/settings.yaml writer_selfcheck.max_rounds
  render_max_attempts_per_shot: 3      # knowledge/settings.yaml loop_settings.max_renders_per_shot
  budget_ledger: data/pipeline/ledger.jsonl
  runs_dir: data/pipeline/runs

# ------------------------------------------------------------------------------------------------ 节点
nodes:
  P0:
    name: 项目方故事提纲
    owner: owner
    output: {schema: nsfs.brief/1, model: ns_schema.storyline:Brief, example: config/pipeline/examples/P0_brief.json}
    ui: {page: "#/script-create", fields: [提纲文本框 outline, 集数 epFrom/epTo, 每集镜数 shots, 每镜秒数 secs, 规则版本 rules, 模型 LlmFields]}
    validators: [check_brief]
    status: 部分      # 页面字段已有；Brief JSON 由 run_chain 从界面字段拼，界面尚未直接产出 Brief
  P1:
    name: 全剧 storyline（人物表、世界观、场景表、分集一段话）
    owner: writer_llm
    output: {schema: nsfs.storyline/1, model: ns_schema.storyline:Storyline, example: config/pipeline/examples/P1_storyline.json}
    ui: {page: "#/script-create", fields: ["（待建）storyline 卡：人物表 / 场景表 / 分集列表"], related: ["#/assets 角色（PeoplePage）", "#/assets 场景（ScenesTab）"]}
    validators: [check_storyline]
    status: 缺→已定（本轮新建 schema + 校验 + 提示词；UI 待建）
  P2:
    name: 单集大纲（节拍、钩子标签、场次）
    owner: writer_llm
    output: {schema: nsfs.episode_outline/1, model: ns_schema.episode_outline:EpisodeOutline, example: config/pipeline/examples/P2_outline.json}
    ui: {page: "#/script-create", fields: ["（待建）分集大纲：节拍表 B1…Bn"]}
    validators: [check_outline]
    status: 缺→已定（本轮新建；UI 待建）
  P3:
    name: 单集剧本（场次、动作、台词、独白）
    owner: writer_llm
    output: {schema: nsfs.screenplay/1, model: ns_schema.screenplay:Screenplay, example: config/pipeline/examples/P3_screenplay.json}
    ui: {page: "#/script-create", fields: ["（待建）剧本视图：场次 / 台词"], related: ["画布 StoryboardDetails 对白 / 独白字段（P4 之后）"]}
    validators: [check_screenplay]
    status: 缺→已定（本轮新建；以前 P3 与 P4 混在一份写作稿里）
  P4:
    name: 分镜表 / Shot Spec（剧本分镜 Markdown → Shot Spec v2）
    owner: writer_llm
    output:
      schema: "剧本分镜 Markdown（config/script_chat_rules.md §2 + sysimpl 附录）→ nsfs.shot_spec/2"
      model: ns_schema.shot_spec:ShotSpec
      parser: services/recipes/ns_recipes/spec_import.py
      importer: services/agent/ns_agent/importer/script_md.py
      example: config/pipeline/examples/P4_episode.md
    ui:
      page: "#/script-create（① 创作草稿 + 格式校验）→ #/script-create?tab=import（② 导入，项目方确认）→ 画布"
      fields: [StoryboardDetails 场景 scene, 人物 cast, 衔接 link, 画面 img, 动作/运镜 motion, 结束状态 end, 表情 expr,
               对白 dialogue, 独白 vo, 环境声 sound_h3, 亲密声 intimate, 本镜配乐 music_cue, 时长 duration, 视频提示词 h3,
               StoryboardTable 分镜表（一镜一行）]
    validators: [validate_qwen_script, shot_spec_missing, shot_spec_sequence, h3_lint, llm_output_check, timeline_lint]
    status: 已定（格式最完整的一段；分拍 / 时间轴 sysimpl-v2 部分落地）
  P5:
    name: 资产（角色设定图 / 身份参考 / 造型版、场景底图、音色、LoRA）
    owner: render
    output: {schema: "assets/characters/<id>/*.provenance.json；场景底图；config/voices.json；LoRA 登记", model: ns_schema.assets}
    ui: {page: "#/assets", fields: [角色详情 PeoplePage, 造型 LooksSection, 场景 ScenesTab, 音色]}
    validators: [knowledge:P4-P5, s1_gate]
    knowledge: [K-AST-*]
    status: 部分（男角身份参考 / 场景底图 / 音色参考缺口，见 K-AST-001、K-AST-R09）
  P6:
    name: 出图提示词与首帧（尾帧）
    owner: system+render
    output: {schema: "data/renders/<ep>/<S>/compiled.json image_prompt / last_prompt；takes.json image#N / last#N", model: ns_schema.frame_spec}
    ui: {page: "画布精修（v3/edit EditCenter：Stage 首尾帧大图、ImageParams、RefBar、VersionChain）", fields: [首帧, 尾帧, 定稿]}
    validators: [knowledge:P5-P6, image_check]
    status: 部分（参考图出图 R 方式待落地 K-AST-R01；首尾帧定稿闸门已有）
  P7:
    name: 视频提示词（H3 官方格式）与配方
    owner: system
    output: {schema: "RenderPlan（services/recipes 配方 + H3 四块 / Ref2VA 六段）", model: services/recipes/ns_recipes/compiler.py}
    ui: {page: "画布精修 VideoBase / LaneSelect；分镜表“视频提示词”列", fields: [h3, 配方]}
    validators: [h3_lint, recipe_lint, knowledge:P4-P7]
    status: 部分（I2VA / FL2VA / Ref2VA 模板与 lint 已有；按秒分拍 RL-T* 新上）
  P8:
    name: 视频片段
    owner: render
    output: {schema: "takes.json video#N（seed、plan_hash、workflow）", model: services/render_router/ns_render/h3_video.py}
    ui: {page: "画布 EpisodeProduce / JobStrip / MotionQc", fields: [视频版本, 运动 QC]}
    validators: [motion_qc, knowledge:P7-P8]
    status: 部分
  P9:
    name: 声音（对白原声 / TTS / 旁白 / BGM / 环境声）
    owner: system+render
    output: {schema: "services/post 音轨；data/music/series10/<ep>.wav + .json（BGM 子链接，P4-P9.bgm）；config/voices.json", model: services/post/ns_post/h3_dialogue.py}
    ui: {page: "#/cut 成片页（CutPage）音频设置；post_settings", fields: [对白来源, BGM, 独白音色]}
    validators: [knowledge:P8-P9, knowledge:P4-P9]
    status: 部分（旁白音色老 = 项目方 v1 bug，见 knowledge/inbox）
  P10:
    name: 剪辑合成
    owner: system
    output: {schema: "data/episodes/<ep>.timeline.json + mp4", model: services/post/ns_post/assemble.py}
    ui: {page: "#/cut", fields: [时间线, 切点, 响度]}
    validators: [knowledge:P9-P10, knowledge:P8-P10]
    status: 部分（剪辑规格 K-EDT-003…009 建议 / 确认中）
  P11:
    name: 审片与重出
    owner: director_llm+system
    output: {schema: "nsfs.director_verdict/1 + tools/iterate_loop 记录", model: tools/iterate_loop/reviewer.py}
    ui: {page: "画布审片（ReviewRow / ReviewMode / OwnerDecision）", fields: [审片结论, 重出, 项目方选择卡]}
    validators: [director_review, knowledge:P10-P11, attribute_bug]
    status: 部分（审片度量已有；bug → 连接归因本轮新建 attribute_bug）
  P12:
    name: 成片交付
    owner: owner
    output: {schema: "成片 mp4 + qa.json + timeline（只含定稿且 QC 通过的 take）"}
    ui: {page: "#/cut 导出", fields: [成片, 交付记录]}
    validators: [knowledge:P11-P12]
    status: 部分

# ------------------------------------------------------------------------------------------------ 连接
# writer：写作 LLM 段的分段提示词（tools/pipeline/writer_prompt.py 从本文件 + knowledge 组装）
links:
  P0-P1:
    from: P0
    to: P1
    owner: writer_llm
    does: 把提纲展开成全剧 storyline：人物表（五格，进 H3）、场景表（六格）、世界观、逐集一段话
    must: [提纲范围内每集一条, 项目方逐集一句话逐字放进 owner_line, 已登记人物 / 场景逐字照抄, 全部角色成年]
    forbid: [改提纲剧情, 新增提纲外的集, 写镜头语言, 在场景卡写人物, 输出 JSON 以外的文字]
    input: [P0]
    rules: [BR-01, BR-02, BR-03, BR-04, SL-01, SL-02, SL-03, SL-04, SL-05, SL-06, SL-07, SL-08, SL-09, SL-10, SL-11, SL-12, LK01-01, LK01-02, LK01-03, LK01-04]
    validators: [check_brief, check_storyline, check_link_p0_p1]
    writer: {template: config/pipeline/prompts/P0-P1.md, output: json, max_tokens: 12000}
    on_fail: writer_repair
    gate: owner_optional          # 竞品都在“剧本概要 / 分集大纲”处让人确认；默认自动通过，项目方可开
    status: 已定（本轮）
  P1-P2:
    from: P1
    to: P2
    owner: writer_llm
    does: 一集一段话 → 节拍表（B1…Bn：场景、人物、预计秒数、标签）
    must: [title / logline / intimate 逐字照抄 storyline, 节拍秒数合计 = 目标时长 ±5, carry_in 接上一集 carry_out]
    forbid: [新增人物 / 场景, 改 logline, 写台词全文, 写镜头语言]
    input: [P1]
    rules: [EO-01, EO-02, EO-03, EO-04, EO-05, EO-06, EO-07, EO-08, EO-09, EO-10, LK12-01, LK12-02, LK12-03, LK12-04]
    validators: [check_outline, check_link_p1_p2]
    writer: {template: config/pipeline/prompts/P1-P2.md, output: json, max_tokens: 6000}
    on_fail: writer_repair
    gate: owner_optional
    status: 已定（本轮）
  P2-P3:
    from: P2
    to: P3
    owner: writer_llm
    does: 节拍 → 场次剧本（动作行、台词、独白、声音），每场标覆盖的节拍
    must: [每个节拍至少被一场覆盖, 场景 = 节拍的场景, 台词 text 只放原文（语气写 tone）, 全集台词 ≤ 3.5 字/秒 × 时长]
    forbid: [新增人物, 删节拍, 写景别 / 运镜（归 P4）, 写 H3 英文]
    input: [P1, P2]
    rules: [SP-01, SP-02, SP-03, SP-04, SP-05, SP-06, SP-08, SP-09, LK23-01, LK23-02, LK23-03, LK23-04, LK23-05]
    validators: [check_screenplay, check_link_p2_p3]
    writer: {template: config/pipeline/prompts/P2-P3.md, output: json, max_tokens: 8000}
    on_fail: writer_repair
    gate: null
    status: 已定（本轮）
  P3-P4:
    from: P3
    to: P4
    owner: writer_llm
    does: 场次剧本 → 剧本分镜（每镜 img / 场景 / 人物 / 衔接 / 分拍 / motion / 时长 / sound / 对白 / 🎙 / H3提示词）
    must: [台词 / 独白逐字带下去, 现行写作规则全部（script_chat_rules.md rules_v2 + sysimpl 附录 + 按触发词附录）, 人物表 / 场景表逐字]
    forbid: [改台词, 新增台词 / 人物 / 场景, 否定词, 人名进 H3, 镜内切镜]
    input: [P1, P2, P3]
    rules: [LK34-01, LK34-02, LK34-03, LK34-04, LK34-05, LK34-06, LK34-07, LK34-08, LK34-09, LK34-10, LK34-11, P4-GATE, P4-SPEC]
    external_rules:              # 现行写作规则（只引用，不复制；规则号见文件内）
      - config/script_chat_rules.md               # rules_v2 §1–§7 + sysimpl-v1 / v2 附录（QW-* / H3-* / S1-* / R-C1 / IMG-* / SS-* / RL-*）
      - config/script_chat_rules_appendix.md      # 按触发词注入
      - config/qwen_writer_system_prompt.txt
      - docs/ep02_iter/writer_rules_addendum.md
      - knowledge:P3-P4                            # K-WRT-* / K-PRM-010 等（writer_text 进提示词）
    validators: [p4_gate, check_link_p3_p4, shot_spec_missing, shot_spec_sequence]
    writer: {template: config/pipeline/prompts/P3-P4.md, output: markdown_episode, max_tokens: 32000, system_from: ns_api.script_chat.build_system_prompt}
    on_fail: writer_repair
    gate: owner_import           # 导入前项目方确认（现行 #/script-create?tab=import）
    status: 已定（格式）；部分（时间轴 sysimpl-v2 刚上，RL-T*）
  P4-P5:
    from: P4
    to: P5
    owner: system+render
    does: 由 Shot Spec 的在画角色 / 场景 / 造型 / 说话人 列出资产需求，缺的出候选给项目方定妆
    must: [露脸角色有已定稿身份参考, 场景有底图, 说话角色有音色]
    forbid: [缺资产时悄悄出片, 用别集造型]
    rules: [knowledge:P4-P5]
    validators: [s1_gate, shot_spec_missing]
    on_fail: needs_owner
    gate: owner_asset            # 定妆 / 资产定稿（项目方）
    status: 部分
  P5-P6:
    from: P5
    to: P6
    owner: system+render
    does: 资产 + Shot Spec → 首帧（参考图出图）、尾帧（编辑）
    rules: [knowledge:P5-P6]
    validators: [image_check]
    on_fail: render_retry
    gate: owner_keyframe         # 首尾帧定稿（C3，项目方要求保留）
    status: 部分
  P4-P6:
    from: P4
    to: P6
    owner: system
    does: Shot Spec img / 结束状态 → 出图提示词（frame_spec 编译，后缀按字段条件生成）
    rules: [knowledge:P4-P6]
    validators: [frame_spec_compile]
    on_fail: writer_repair
    status: 部分（chain_audit A2/A3/A11 条件后缀已修一部分）
  P6-P7:
    from: P6
    to: P7
    owner: system
    does: 定稿首帧（尾帧）+ 配方选择（首帧 / 首尾帧 / Ref2VA）
    rules: [knowledge:P6-P7]
    validators: [recipe_lint]
    on_fail: render_retry
    status: 部分
  P4-P7:
    from: P4
    to: P7
    owner: system
    does: Shot Spec H3 正文 → 按模式编译 H3 提示词（I2VA / FL2VA / Ref2VA），按秒分拍时间轴校验
    rules: [knowledge:P4-P7]
    validators: [h3_lint, timeline_lint, recipe_lint, llm_output_check]
    on_fail: writer_repair
    status: 部分
  P7-P8:
    from: P7
    to: P8
    owner: render
    does: RenderPlan → GPU 作业 → 视频 take（带 provenance）
    rules: [knowledge:P7-P8]
    validators: [motion_qc]
    on_fail: render_retry
    status: 部分
  P4-P9:
    from: P4
    to: P9
    owner: system
    does: Shot Spec audio（对白 / 独白 / 时段 / 嘴型 / 配乐 cue）→ 音轨计划（独白 TTS、BGM 提示点）；整集配乐见下方 bgm 子链接
    rules: [knowledge:P4-P9]
    validators: [shot_spec_missing, bgm_brief_check, bgm_candidate_gate]
    on_fail: writer_repair
    status: 缺（独白音色 / 旁白风格没有规则，v1 bug“旁白声音老”落在这里）；整集配乐（bgm）已定（BGM10 11-01）
    # BGM 子链接（BGM10 2026-11-01，docs/BGM.md）：P3 + P4 → 写作模型 brief → 本地 ACE-Step 候选 → 自动度量 + 闸门 → 审听模型挑选
    # → data/music/series10/epNN.wav + epNN.json（P9 产物）→ P9-P10 合成（--music-dir）。项目方 10-31：整集统一 BGM（一集一条，段落换气）
    bgm:
      runner: tools/bgm/agent.py                    # --run <runs_dir/id> --eps 1-10；断点续跑，已交付的集跳过
      input: [P3（target_duration_s、场次）, P4（每镜时长 / 有无人声 / 【配乐】cue / 本集 **配乐** 行与【BGM】）]
      timeline: tools/bgm/bgm_timeline.py           # 确定性解析，不判断内容
      output:
        brief: {schema: nsfs.bgm_brief/1, path: "data/music/series10/epNN/brief.json", example: config/prompts/bgm_brief.example.json}
        track: "data/music/series10/epNN.wav（48 kHz 24-bit 立体声，−16 LUFS，真峰 ≤ −1 dBTP）"
        assembly_meta: "data/music/series10/epNN.json（ns_post.music.find_music 格式：cues / shot_starts / duck / model / seed）"
        record: "data/music/series10/epNN/meta.json（brief、模型、种子、全部候选度量、每轮决定与理由）+ cands/*.flac"
      writer: {template: config/prompts/bgm_brief.writer.md, output: json, purpose: music_brief, max_tokens: 6000}
      reviewer: {template: config/prompts/bgm_brief.review.md, output: json, purpose: music_brief, max_tokens: 3000}
      model: "ACE-Step 1.5（MIT）：acestep-v15-xl-sft 50 步（GPU 空闲显存 ≥12.5 GB，int8 + offload）> turbo 8 步 > CPU turbo；config/bgm.json tiers"
      must: [纯器乐, 一集一条（sections 换段不换曲）, 时间按 P4 时间轴, 人声镜头必须在 duck 里, 候选全部记录度量与决定]
      forbid: [具名歌曲 / 艺人 / 作品, 人声 / 合唱 / 歌词, 外部生成 API, 用旧剧 data/music/epNN.wav, Claude 判断内容]
      rules: [BGM-B01, BGM-B02, BGM-B03, BGM-B04, BGM-B05, BGM-B06, BGM-B07, BGM-B08, BGM-B09, BGM-B10, BGM-B11, BGM-B12, BGM-B13, BGM-B14]
      gates_system: "config/bgm.json gates：vocals（Demucs vocal_rel_db / CLAP p_vocal）、削波、最长静音、时长、CLAP 下限、能量反向"
      validators: [bgm_brief_check, bgm_candidate_gate]
      on_fail: "brief 校验不过 → writer_repair（≤2 轮）；候选全不过 / 审听不选 → 按审听模型 retry + 闸门失败项调整重出（≤3 轮）→ 仍无 → needs_owner（合成 --no-bgm）"
      gate: bgm_review
      knowledge: [K-EDT-B01, K-EDT-B02, K-EDT-B03, K-EDT-B04, K-EDT-B05, K-EDT-B06]
      status: 已定（BGM10 11-01）
  P8-P9:
    from: P8
    to: P9
    owner: system
    does: 取 H3 原声做对白，TTS 只做独白和兜底；整集一条 BGM
    rules: [knowledge:P8-P9]
    validators: []
    on_fail: render_retry
    status: 部分
  P8-P10:
    from: P8
    to: P10
    owner: system
    does: 只取定稿 + QC 通过的 take 进时间线；去抖、校色
    rules: [knowledge:P8-P10]
    validators: []
    on_fail: needs_owner
    status: 部分
  P9-P10:
    from: P9
    to: P10
    owner: system
    does: 音画合成：切点、剪定住段、拆刀、响度、色彩空间；整集配乐 = tools/assemble_episode.py --music-dir data/music/series10（没有该集配乐 → --no-bgm），人声处按 epNN.json duck 压低
    rules: [knowledge:P9-P10]
    validators: []
    on_fail: rerun_post
    status: 部分
  P10-P11:
    from: P10
    to: P11
    owner: director_llm+system
    does: 成片 / 片段审片：身份、泛红、静止、顿挫、近黑、嘴型、构图对剧本
    rules: [knowledge:P10-P11]
    validators: [director_review]
    on_fail: retry_via_attribution
    status: 部分
  P11-RETRY:
    from: P11
    to: "<归因到的连接>"
    owner: system
    does: 审片发现 → attribute_bug 归因到某段连接 → 按该段 on_fail 回退（写作重写 / 换种子 / 换配方 / 交项目方）
    rules: [knowledge:P11-RETRY]
    validators: [attribute_bug, iterate_loop]
    on_fail: needs_owner
    status: 部分（本轮建归因；loop 阶梯 ARCH）
  P11-P12:
    from: P11
    to: P12
    owner: owner
    does: 全集定稿检查（响度、许可、全部 take 定稿）→ 交付
    rules: [knowledge:P11-P12]
    validators: []
    on_fail: needs_owner
    gate: owner_final
    status: 部分

# ------------------------------------------------------------------------------------------------ 回退策略
fallback:
  writer_repair:
    does: 校验失败 → 把错误清单（规则号 + 原文要求）带回写作 LLM 重写同一段，最多 writer_max_repair_rounds 轮
    then: 仍失败 → 状态 needs_writer，停在该节点；整条链停（下游不消费失败产物），通知总调度
    evidence: knowledge/settings.yaml writer_selfcheck.max_rounds；refactor_proposal §3.2
  render_retry:
    does: 按 knowledge 的 loop 阶梯（tools/iterate_loop/rules.yaml）换种子 / 后处理 / 换配方，每镜最多 render_max_attempts_per_shot 次
    then: needs_owner：画布选择卡（换模型 / 放宽 / 跳过占位 / 人工参考），其他镜不阻塞
    evidence: 官方 fallback-policy.md；refactor_proposal §7.4
  rerun_post: {does: 重跑合成（无 GPU 成本）, then: needs_owner}
  needs_owner: {does: 停在闸门，画布出选择卡, then: 项目方选择}
  retry_via_attribution: {does: tools/pipeline/attribute_bug.py 归因后按目标连接的 on_fail 处理, then: 规则草案进 knowledge/inbox/}

gates:
  owner_optional: {who: owner, default: auto_pass, note: 默认自动通过；项目方可在会话里开启人工确认（不新增强制闸门）}
  owner_import: {who: owner, where: "#/script-create?tab=import", note: 现行：剧本候选由项目方确认后导入}
  owner_asset: {who: owner, where: "#/assets", note: 定妆 / 资产定稿}
  owner_keyframe: {who: owner, where: 画布精修首尾帧定稿, note: C3 项目方要求保留}
  owner_final: {who: owner, where: "#/cut", note: 成片交付}
  bgm_review: {who: review_llm, default: auto_pass, where: "#/sound?tab=bgm", note: 审听模型在闸门通过的候选里挑；项目方可在声音页「配乐」一键换用 / 撤销（BGM10）}

