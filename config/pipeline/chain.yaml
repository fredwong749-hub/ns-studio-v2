# ------------------------------------------------------------------------------------------------ 上游规则
# writer_text = 进写作提示词的一句话（只讲格式 / 可实现性）；check = 实现它的校验器；evidence = 来源
rules:
  # P0 提纲（系统从界面字段拼 Brief；项目方原文不改）
  - {id: BR-01, link: P0-P1, node: P0, level: block, check: check_brief, confidence: high, evidence: "本契约（系统字段）",
     writer_text: "（系统用）Brief 须是 nsfs.brief/1 JSON"}
  - {id: BR-02, link: P0-P1, node: P0, level: block, check: check_brief, confidence: high, evidence: "项目方原话：我给出一个故事提纲",
     writer_text: "（系统用）提纲不能为空"}
  - {id: BR-03, link: P0-P1, node: P0, level: block, check: check_brief, confidence: high, evidence: "services/api/ns_api/script_chat.py POST /sessions episodes",
     writer_text: "（系统用）集数范围 from ≤ to，一次 ≤100 集"}
  - {id: BR-04, link: P0-P1, node: P0, level: block, check: check_brief, confidence: high, evidence: "本契约",
     writer_text: "（系统用）逐集一句话的集号在范围内"}
  # P1 storyline
  - {id: SL-01, link: P0-P1, node: P1, level: block, check: check_storyline, confidence: high, evidence: "本契约 nsfs.storyline/1",
     writer_text: "只输出一个 JSON 对象（可包在 ```json 代码块里），字段严格按 schema，不加字段、不写解释"}
  - {id: SL-02, link: P0-P1, node: P1, level: block, check: check_storyline, confidence: high, evidence: "config/script_chat_rules.md ★ 最高优先级：全部角色为虚构成年人",
     writer_text: "每个角色 age 写整数，全部 ≥18"}
  - {id: SL-03, link: P0-P1, node: P1, level: block, check: check_storyline, confidence: high, evidence: "script_chat_rules.md §2P 角色id 格式（QW-P*）",
     writer_text: "char_id 写 ch_<小写英文数字下划线>（项目方给女主指定固定 id 时用 lead_<小写字母>；已登记角色照抄全局头的 id）；名字和 id 全剧唯一"}
  - {id: SL-04, link: P0-P1, node: P1, level: block, check: check_storyline, confidence: high, evidence: "script_chat_rules.md §2P；chain_audit A1/B1 族裔丢失",
     writer_text: "en_phrase 是英文身份短语：年龄、性别、族裔、发型发色、脸 / 肤色 / 体型；不写服装、人名、触发词、否定词、双引号"}
  - {id: SL-05, link: P0-P1, node: P1, level: block, check: check_storyline, confidence: high, evidence: "script_chat_rules.md §2P VOICE；K-PRM-010",
     writer_text: "voice_phrase 是英文声线短语，含 voice 一词，写音色、音区、语速；不写人名、否定词、双引号"}
  - {id: SL-06, link: P0-P1, node: P1, level: block, check: check_storyline, confidence: high, evidence: "script_chat_rules.md §2S（QW-SC2/SC4/SC5）",
