  check_storyline: {kind: python, ref: "ns_schema.storyline:check_storyline", node: P1}
  check_link_p0_p1: {kind: python, ref: "ns_schema.storyline:check_link_p0_p1", link: P0-P1}
  check_outline: {kind: python, ref: "ns_schema.episode_outline:check_outline", node: P2}
