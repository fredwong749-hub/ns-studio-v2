# 运镜词表（单一事实来源；DIRECTOR，总调度 fredw-2b 派 L-107，2026-11-02）
# 项目方 11-02 03:1x 原话：“我发现了一些 AI 的运动镜头，需要你把这些内容放到镜头的提示词里面去……1. 让 Master Agent、剧本 Agent
# 和导演 Agent 学会这个事情，并写到本地规则里。2. 在 Season 2 里面，可以把这些内容写进去。”
# 资料：docs/reference/camera_moves_20261102.md（项目方粘贴的“AI 视频运镜指令大全”，适配 Runway / 可灵 / 剪映）。
# 本项目视频模型是 Pika Flex：每种运镜在 Pika 上 A/B（data/ab/video_rca/cm_r1/，2 seed，判据见 ab_criteria），
# 通过的才 enabled: true；没过 / 没测的 enabled: false 并写原因。K-REN-801 / K-EDT-811 / camera_norm / cut_plan 都读本文件，不再写死。
# 读写：services/agent/ns_agent/camera_vocab.py（load / match / clause / enabled_ids）。改这里要同步跑 tests/test_director.py。
schema: nsfs.camera_moves/1
version: cm-v1-2026-11-02
ab_criteria:
  doc: 每种运镜在同一镜（ep10-S2 中景单人坐姿，S★ R0 首帧）上只换运镜句，2 seed；全部满足才 enabled
  rules:
    - {id: AB1, text: "成片运动项：score_clip mean ≥ 0.5（不站桩）且无镜内硬切（cuts = 0）"}
    - {id: AB2, text: "面部稳定：林晚 SFace 中位 ≥ 0.30 且 p10 ≥ 0.25（与基线 static 同口径）"}
    - {id: AB3, text: "无分身 / 多肢：V6 dup_side_frac ≤ 0.15 且 extra_hand_frac ≤ 0.05 且 people 与首帧一致"}
    - {id: AB4, text: "J4 去抖后可用：J4 ≤ 1.3 或 J4_z < 3（> 则记‘4 帧一顿’软项，由 dejudder 处理，不单独否决）"}
    - {id: AB5, text: "景别不跑档：size_measured 与首帧景别差 ≤ 1 档（Pika 本身会往远退，RCA_r1 C16）"}
    - {id: AB6, text: "执行准确度：VIDLAB clipmetrics v4（背景 LK 光流 + 仿射累计机位轨迹，挡掉人脸和身体）实测运镜量在目标小幅档的 0.5–2 倍、方向对 → 1；中位 ≥ 0.5 才算执行了。没有该指标 = 未测（不否决）"}
  seeds: [20261102, 20261103]
  shot: ep10-S2
exec_modes:
  camctl_r1: "VIDLAB 11-02 冒烟（data/rsi/vidlab/ab_vl_r1_camctl_truck.json，ep10-S2 横移 seed 20261102，107 帧同 seed 对照）：执行准确度 0.0 → 1.0（横移 -0.0711 / 目标 -0.07，杂旋转 2.3° → 0.3°），但看镜头占比 0 → 0.775 触发硬规则护栏 → 不通过；158 帧在 gpu36:1 / gpu33:1 OOM，107 帧可跑、单条 365 s；右缘黑边已修。横移 / 摇镜 / 俯仰暂不改 camctl，等第 2 轮（strength 0.4、end_percent 0.3、人物遮罩外扩）"
  doc: 运镜的执行方式。prompt = 只靠 Pika 提示词；camctl = 首帧背景 Canny 按机位轨迹仿射成控制视频，经 MiniMax H3 Fun ControlNet 驱动（VIDLAB tools/vidlab/camctl.py，冒烟中）
  measured_by: "VIDLAB tools/vidlab/clipmetrics.py v4，41 条 Pika 片按提示词运镜分组的执行准确度中位：push_in 1.0（18）、static 1.0（3）、arc 0.64（7）、truck_right 0.10（2；cm_r2 横移实测 -0.7% 画宽，目标 -7%，另有 2.2° 杂旋转）、tilt_up 0.0（11）"
  conclusion: "Pika 能执行推近和固定；横移、俯仰基本不按提示词执行（背景净运动 0.029/s 不比好莱坞参照 0.017/s 少，问题是方向不受控）→ truck / pan / tilt 只靠提示词不 enabled，camctl 冒烟通过后把执行方式改成 camctl 再 A/B"
constraints_en: >-
  Her face stays stable and sharp throughout, with no clipping through objects, no duplicate people, and no on-screen text or watermark.
constraints_zh: 人物面部稳定、无穿模卡顿、禁止分身、无字幕水印
# L-192（项目方 11-05，MASTER_PICTURE；L-129 修订）：白名单 2 → 6 种 static / push_in / pull_out / bolt_push_settle / handheld_follow / pedestal_up；
# 双人及以上在画的镜头只允许下面四种（阶段 0.2b 基准：双人中景的横移 / 环绕 / 升都被做成“后拉 + 升”，不受控；bolt_push_settle 是否允许待项目方确认，暂按 L-192 原话只 4 种）。编译层 camera_norm.multi_person_ok 判，
# 不合规退回 push_in（enabled 时）否则 static，改动记 h3_norm / notes。truck / arc 继续 disabled（只留 h3_official_candidate 待复测）
multi_person_moves: [static, push_in, pull_out, handheld_follow]
# amp：只用 small（K-PRM-101 / Pika P16）；speed 词一律不写（项目方：节奏慢）；dir 由导演层按视线 / 站位给 left|right
# h3_official（CODER-PT 11-05，PLAN_EP01_FINISH §9 阶段 0.2b 基准 + §4 2.1）：提示词模板 v2 的官方写法运镜句（H3 base-en §4.3：
#   动词 + 幅度 + 速度，独立成句紧跟构图句）。占位：{amp}=with small/large amplitude（medium 不写）、{speed}=at slow/fast speed（normal 不写）、
#   {P}=所有格代词、{P1}=主格、{P2}=宾格、{dir}/{dir_inv}=方向 / 反方向。h3_amp_shift=-1：基准里推 / 拉幅度做出来是目标的 1.2–2.8×，幅度词降一档。
#   只在 run_style.json runs.<剧>.prompt_template.video = v2 时用（默认 v1，不改现行 template 句）；enabled 按 L-192（项目方 11-05 修订的白名单 6 种），不在这里另改。
#   h3_official_candidate：基准做得出但方向反、幅度过大的运镜（横移 / 环绕）的候选写法（方向反写 + 中档幅度 = 不写幅度词），disabled（L-192 未纳入），待复测后项目方再定。
