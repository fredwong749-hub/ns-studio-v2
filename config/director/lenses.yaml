# 景别 → 默认镜头（情绪命中 moods 时在同景别候选里优先）；decider = code
by_size:    # 缺省（编译器没读到剧本【镜头】/【光学】时的兜底）= L-192 档（PS-MASTER 11-05 定：建立→28/35、中景双人→50、近景/过肩→85、特写→135/100、插入→100 微距）；
            # 旧 L-145 档（summilux_50 / apo_summicron_75…）只在剧本【镜头】显式写 id 时用。by_kind 与 by_size 是同一张表的两种索引（CODER-PT prompt_template_v2.lens_of 读 by_kind）
