  特写: [leica_cine_135_t12, arri_cine_85_t14]
  近景: [arri_cine_85_t14, arri_cine_65_t14]
  中近景: [arri_cine_85_t14]
  中景: [arri_cine_50_t2]
  中全景: [leica_cine_28_t28, arri_cine_50_t2]
  全景: [leica_cine_28_t28, leica_cine_35_t4]
by_kind:    # L-192 焦段表按镜头类型（模板 v2 兜底：分镜没写【镜头】时 lens_kind → 这里；单一来源，run_style 不再另写一份）
