<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NS2 全剧总览</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">NS<b>2</b> · 全剧总览</div>
  <div class="run-pick" title="剧集（run）">
    <input id="run-input" type="text" value="series10_v2" aria-label="剧集">
    <button id="run-apply" type="button" class="sm">切换</button>
  </div>
  <nav class="stages" id="stages" aria-label="五个阶段"></nav>
  <div class="live" id="live" title="每 15 秒自动刷新"><span class="dot"></span><span id="updated-at">连接中…</span></div>
  <button id="refresh-btn" type="button" class="ghost sm" title="立即刷新（R）">⟳ 刷新</button>
  <button id="key-chip" type="button" class="chip">🔑</button>
  <button id="theme-btn" type="button" class="ghost sm" title="深色 / 浅色">◐</button>
</header>

<div class="wrap">
  <section class="banner" aria-label="要你处理">
    <div>
      <h2 id="banner-title">正在加载…</h2>
      <div class="facts" id="banner-facts"></div>
    </div>
    <div class="cta">
      <button id="bulk-all" type="button" class="primary big" disabled>✓ 全部用这版</button>
      <span id="bulk-hint" class="hint"></span>
    </div>
  </section>

  <div id="error" class="error" hidden></div>

  <div class="toolbar">
    <div class="group" id="ep-chips" aria-label="按集"></div>
    <span class="spacer"></span>
    <div class="group" id="status-chips" aria-label="按状态"></div>
  </div>
  <!-- 筛选的“真值”：芯片点了改它们，脚本统一从这里读（键盘 / 读屏也能直接用） -->
  <div class="toolbar" hidden>
    <select id="ep-filter"><option value="">全部集</option></select>
    <select id="status-filter">
      <option value="">全部状态</option>
      <option value="you">要你处理</option>
      <option value="busy">在办</option>
      <option value="bad">卡住 / 失败</option>
      <option value="best_effort">尽力版</option>
      <option value="final">已定稿</option>
    </select>
  </div>

  <main id="episodes" aria-label="各集"></main>
</div>

<footer class="dock" id="dock">
  <div class="sum" id="videos-summary"></div>
  <span class="spacer"></span>
  <span class="muted small"><span class="kbd">R</span> 刷新 · <span class="kbd">1</span>–<span class="kbd">9</span> 跳到第几集 · 点图看大图</span>
</footer>

<script src="key.js"></script>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
