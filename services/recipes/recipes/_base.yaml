# 所有 H3 视频配方的公共基底（抽象，不会被选中）。
# 每个参数都要有 provenance（下方 provenance 表，按点路径最长前缀匹配；子配方改了值必须同时写自己的 provenance）。
# 状态：确认 = 可硬编码；建议 = 证据够、默认开；待验 = 要 A/B（experiment 字段写实验号，见 docs/ep02_iter/h3_comfy_expert.md §8）；
#       待许可登记 = 社区权重许可未登记，不能设默认。
id: _base
abstract: true
label: H3 基底
status: 确认
mode: i2va                       # i2va | fl2va | ref2va ；two_stage 另见 two_stage.enabled
model:
  unet: minimax_h3_fl2va_pruned_int8_convrot.safetensors
  clip: qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
  clip_type: minimax
  video_vae: minimax_h3_video_vae_int8_convrot.safetensors
  audio_vae: minimax_h3_audio_vae_fp32.safetensors
loras: {}
sampling:
  steps: 24
  sampler: euler
  scheduler: simple
  shift: [12.0, 3.0]
  shift_node: true
  guider: BasicGuider
  cfg: 1.0
  attention: pytorch
  sigmas: null
  banned_nodes: [EasyCache, LazyCache, MiniMaxH3Cache, SpectrumPatch, Spectrum, TeaCache, CacheDiT, SolAttention, TorchCompileModel, ModelPatchTorchSettings]
resolution:
  width: 768
  height: 1344
  keyframe_crop: center_lanczos
  max_megapixels_3090: 1.033
frames:
  fps: 24
  grid: 17k+5
  min: 107
  max: 362
  lane_max_default: 260
  long_lane: "gpu36:2"
keyframes:
  last_frame_mode: none
  min_first_last_diff: 10.0
seed:
  policy: hash                    # hash(spec_id, attempt, recipe_id) —— 每镜不同、可重放
  share_across_keyframe_change: false
two_stage:
  enabled: false
ref2va:
  enabled: false
prompt:
  format: base-en
  style_lead: "Live-action, cinematic, shallow depth of field,"
  require_soundscape: true
  period_before_d_close: true
  silent_non_speakers: true
  voiceover_phrase: says in an off-screen voiceover
  voiceover_lips: while {pron} lips remain completely closed.
  retry_anchor_prefix: true
  max_chars: 7000
  no_negative: true
  # ACTING 11-01（项目方 R11-2“演员的眼睛不要看镜头”、R11-8“每个镜头第一帧演员都看着镜头而且停顿 1 秒多”）：
  # 系统层两句正向提示（H3 不认否定，RL-N1），放在第一个分拍时间码之前；只写物理 / 视线方向，不写剧情。出处 docs/acting/PERFORMANCE_RULES.md E1/E5/P1/P2
  open_motion_cue: "The movement is already under way in the very first frame and carries on continuously from the first second."
  eyeline_cue: "Each person's gaze rests on a scene partner or on an object within the scene, angled off to the side of the frame."
  # VIDEO-RCA 11-01（K-REN-701）：描述句里删掉该景别看不见的下半身造型分句（同出图 framing.HIDE）。VRCA-E3（r2）：Pika 下无效（S4/S5 同 seed 景别与印样不变），保持关
  hide_offframe_parts: false
post:
  dejudder: true
  dejudder_encode: bt709
  interpolate_to_fps: null
  trim_frozen:
    enabled: true
    diff: 0.35
    min_run_s: 0.3
    min_keep_s: 1.5
  color_match: lab_gain_bias_lerp_v1
  skin_guard: false
  face_refine: false
  upscale_4k: false
acceptance:
  still_frac_max: 0.5
  frozen_tail_s_max: 0.5
  frozen_head_s_max: 0.5
  j4_max: 1.2
  j4_z_max: 3.0
  cheek_a_drift_max: 6.0
  cheek_red_max: 0.25
  red_blob_max: 0.01
  sface_ref_min: 0.30
  sface_self_min: 0.60
  dark_run_s_max: 1.0
  lipsync_corr_min: 0.3            # 编译器只在“有画内对白”的镜头保留这一项
fallback: []
lane:
  prefer: any
provenance:
  prompt.open_motion_cue: {src: "项目方 R11-8 原话“每个镜头第一帧,演员都看着镜头,而且停顿1秒多”；CineCrew technical_director.yaml “SPLIT SECOND BEFORE the main action”；H3 SKILL.md I2VA 顺序 action onset（docs/acting/PERFORMANCE_RULES.md P1/P2）", date: 2026-11-01, status: 确认}
  prompt.eyeline_cue: {src: "项目方 R11-2 原话“演员的眼睛不要看镜头”；CineCrew “Who looks at whom (eyelines)”；StageMilk “never look straight down the lens”（docs/acting/PERFORMANCE_RULES.md E1/E5/E6）；H3 不认否定（RL-N1）故写正向", date: 2026-11-01, status: 确认}
